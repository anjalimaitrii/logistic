name: Deploy Dev Frontend (PM2)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and build
        env:
          NEXT_PUBLIC_API_URL: https://fleet-backend-dev.maitriiinfotech.com
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build

      - name: Upload built files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AFRICA_SERVER_HOST }}
          username: ${{ secrets.AFRICA_SERVER_USER }}
          port: ${{ secrets.AFRICA_SERVER_PORT }}
          key: ${{ secrets.AFRICA_SSH_PRIVATE_KEY }}
          source: ".next/,public/,package.json,pnpm-lock.yaml,next.config.ts,ecosystem.dev.config.cjs"
          target: /home/ubuntu/fleet-logistic/dev/frontend
          rm: false

      - name: Install prod deps and restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AFRICA_SERVER_HOST }}
          username: ${{ secrets.AFRICA_SERVER_USER }}
          port: ${{ secrets.AFRICA_SERVER_PORT }}
          key: ${{ secrets.AFRICA_SSH_PRIVATE_KEY }}
          script: |
            set -e
            pm2 update 2>/dev/null || true
            cd /home/ubuntu/fleet-logistic/dev/frontend
            npm install -g pnpm 2>/dev/null || true
            pnpm install --prod --frozen-lockfile --ignore-scripts
            pm2 reload ecosystem.dev.config.cjs --env development 2>/dev/null || pm2 start ecosystem.dev.config.cjs --env development
            pm2 save
            echo "✅ fleet-frontend-dev deployed via PM2"
